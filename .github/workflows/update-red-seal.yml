name: Update Red Seal Credential

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update credential wording
        shell: bash
        run: |
          if grep -q 'Interprovincial Red Seal' index.html; then
            python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '<div class="about-entry"><span class="detail-meta">Interprovincial Red Seal</span><h3>Journeyperson Insulator</h3></div>'
          new = '<div class="about-entry"><span class="detail-meta">Red Seal Endorsement</span><h3>Journeyperson Insulator (Heat and Frost)</h3></div>'
          if old not in text:
              raise SystemExit('Expected credential block not found')
          path.write_text(text.replace(old, new, 1))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update Red Seal credential wording"
            git push
          fi
